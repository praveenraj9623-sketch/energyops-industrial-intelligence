name: Phase 1 verification
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Confirm raw data is absent from Git
        run: |
          test ! -f data/raw/Steel_industry_data.csv
          git check-ignore -q data/raw/Steel_industry_data.csv
      # Source verification is local-only because the licensed CSV is not committed.
